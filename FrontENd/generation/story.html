<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Votre Histoire</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-gradient-to-b from-gray-900 to-gray-800 text-white flex flex-col items-center p-8 min-h-screen">
    <!-- Titre -->
    <h1 class="text-4xl font-extrabold mb-4 text-yellow-400">📖 Votre Histoire Générée</h1>
    <p id="loading" class="text-yellow-500 text-center text-lg">
        <strong>⏳ Génération de l’histoire...</strong> <br>
        Cela peut durer plusieurs minutes. Merci de patienter.
    </p>

    <!-- Contenu de l'histoire -->
    <div id="story-container" class="bg-gray-800 p-6 rounded-lg shadow-lg max-w-2xl text-white hidden"></div>

    <!-- Ligne de boutons -->
    <div class="mt-4 flex space-x-2">
        <button id="prev-chapter" class="px-6 py-3 bg-gray-500 text-white rounded-lg hidden">⬅️ Chapitre Précédent</button>
        <button id="next-chapter" class="px-6 py-3 bg-blue-500 text-white rounded-lg hidden">➡️ Chapitre Suivant</button>
    </div>

    <!-- Boutons Premium -->
    <div class="mt-4 flex flex-col items-center space-y-4">
        <button id="get-video" class="px-6 py-3 bg-purple-500 text-white rounded-lg hidden">
            🎥 Obtenir l'histoire en vidéo (Premium)
        </button>

        <button id="download-pdf" class="px-6 py-3 bg-green-500 text-white rounded-lg hidden">
            📄 Télécharger en PDF (Premium)
        </button>
    </div>

    <!-- Bouton Retour -->
    <button onclick="window.location.href='index.html'" class="mt-4 px-6 py-3 bg-red-500 text-white rounded-lg">↩️ Retour</button>

    <script type="module" src="./story.js"></script>
</body>
</html>
